<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Banking</title>
</head>
<body>
    <h1>Login</h1>
    <form id="login-form">
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <a href="#" id="forgot-password">Forgot Password?</a>
    </form>

    <div id="recovery-form" style="display: none;">
        <h2>Password Recovery</h2>
        <form>
            <label for="security-question">Select a Security Question:</label>
            <select id="security-question" required>
                <option value="pet">What is your pet's name?</option>
                <option value="mother-maiden">What is your mother's maiden name?</option>
                <option value="birth-city">In what city were you born?</option>
            </select>
            <input type="text" placeholder="Your Answer" required>
            <button type="submit">Recover Password</button>
        </form>
    </div>

    <div id="dashboard">
        <h2>Main Menu</h2>
        <nav>
            <ul>
                <li><a href="#account">Account Overview</a></li>
                <li><a href="#transfer">Transfer Funds</a></li>
                <li><a href="#payments">Payments</a></li>
                <li><a href="#support">Support</a></li>
            </ul>
        </nav>
    </div>

    <script>
        document.getElementById('forgot-password').addEventListener('click', function(event) {
            event.preventDefault();
            document.getElementById('recovery-form').style.display = 'block';
        });
    </script>
</body>
</html>
