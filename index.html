<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Recovery</title>
</head>
<body>
    <h1>Login Recovery</h1>
    <form id="recoveryForm">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="securityQuestion">Security Question:</label>
        <select id="securityQuestion" name="securityQuestion" required>
            <option value="pet">What was your first pet's name?</option>
            <option value="school">What was the name of your elementary school?</option>
            <option value="mother">What is your mother's maiden name?</option>
        </select>
        <input type="text" id="securityAnswer" name="securityAnswer" placeholder="Answer" required>
        <br>
        <input type="submit" value="Reset Password">
    </form>

    <script>
        document.getElementById('recoveryForm').onsubmit = function(event) {
            event.preventDefault();
            // Handle form submission, validate inputs and send verification email
            // This is just a placeholder for the actual implementation
            alert('A verification email has been sent, please check your inbox!');
        };
    </script>
</body>
</html>
